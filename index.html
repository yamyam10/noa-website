<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090c14">
  <meta name="description" content="乃愛（NOA）のプロフィールとリンク。のんびり推し活中。">
  <title>NOA のプロフィール</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f0f4ff;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 18px 14px 28px;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(255,255,255,.16) 0 2px, transparent 3px),
        radial-gradient(circle at 92% 84%, rgba(255,255,255,.12) 0 2px, transparent 3px),
        linear-gradient(145deg, #0757e8 0%, #1468ff 48%, #0649cf 100%);
    }

    a { color: inherit; }
    .page { width: min(100%, 470px); margin: 0 auto; }

    .topline {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin: 3px 0 15px;
      color: #e5eeff;
      font-size: .68rem;
      font-weight: 900;
      letter-spacing: .13em;
    }

    .topline::before, .topline::after {
      width: 18px;
      height: 1px;
      background: rgba(255,255,255,.65);
      content: "";
    }

    .profile-card {
      position: relative;
      overflow: hidden;
      padding: 28px 20px 24px;
      border: 2px solid rgba(255, 255, 255, .76);
      border-radius: 32px;
      background:
        radial-gradient(ellipse 76% 24px at 50% 355px, #0757e8 98%, transparent 100%),
        linear-gradient(180deg, #0757e8 0 355px, #080a10 355px);
      box-shadow: 0 20px 55px rgba(0, 0, 0, .42), inset 0 0 0 5px rgba(255,255,255,.025);
      text-align: center;
      backdrop-filter: blur(12px);
    }

    .profile-card::before, .profile-card::after {
      position: absolute;
      width: 145px;
      aspect-ratio: 1;
      border: 1px solid rgba(34, 105, 255, .28);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }
    .profile-card::before { top: -98px; left: -75px; box-shadow: 0 0 0 13px rgba(20,96,255,.13), 0 0 0 26px rgba(20,96,255,.07); }
    .profile-card::after { right: -100px; bottom: 60px; width: 180px; }

    .card-label {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #080a10;
      color: #fff;
      font-size: .65rem;
      font-weight: 900;
      letter-spacing: .13em;
    }

    .avatar-wrap {
      position: relative;
      display: grid;
      width: 130px;
      aspect-ratio: 1;
      place-items: center;
      margin: 19px auto 13px;
    }

    .avatar {
      display: block;
      width: 108px;
      aspect-ratio: 1;
      border: 5px solid #080a10;
      border-radius: 43% 57% 51% 49% / 46% 45% 55% 54%;
      background: #080a10;
      box-shadow: 0 8px 0 #030407, 0 12px 28px rgba(0, 0, 0, .38);
      object-fit: cover;
      object-position: center;
      transform: rotate(-5deg);
    }

    .orbit {
      position: absolute;
      inset: 3px;
      border: 1px dashed rgba(66, 131, 255, .9);
      border-radius: 50%;
      transform: rotate(20deg);
    }

    .deco {
      position: absolute;
      display: grid;
      width: 34px;
      aspect-ratio: 1;
      place-items: center;
      border: 3px solid #080a10;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, .28);
      font-size: 1rem;
    }
    .deco.egg-decoration {
      top: 3px;
      right: 4px;
      width: 38px;
      border-radius: 48% 52% 43% 57% / 56% 43% 57% 44%;
      background: #e8e4dc;
      box-shadow: 0 4px 10px rgba(0, 0, 0, .3);
      transform: rotate(-12deg);
    }
    .egg-yolk {
      display: grid;
      position: relative;
      z-index: 1;
      width: 14px;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 50%;
      background: #ffcf52;
      box-shadow: inset -2px -2px 0 rgba(217, 153, 49, .19);
      color: #76583a;
      font-size: 5px;
      font-weight: 1000;
      letter-spacing: -1px;
      white-space: nowrap;
    }
    .deco.star {
      bottom: 3px;
      left: 4px;
      background: #1768ff;
      color: #fff;
      transform: rotate(-12deg);
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: 2rem;
      font-weight: 1000;
      letter-spacing: .04em;
      line-height: 1.25;
    }
    h1 .reading {
      display: inline-block;
      margin-left: 5px;
      color: #fff;
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .1em;
      vertical-align: .28em;
    }
    .name-latin {
      margin: 4px 0 12px;
      color: #e2ebff;
      font-size: .7rem;
      font-weight: 900;
      letter-spacing: .32em;
    }
    .bio {
      position: relative;
      z-index: 1;
      margin: 0 auto;
      color: #eef4ff;
      font-size: .82rem;
      line-height: 1.9;
    }

    .tags {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
      margin: 16px 0 22px;
    }
    .tag {
      padding: 6px 10px;
      border: 1px solid #30323b;
      border-radius: 999px;
      background: #080a10;
      color: #d3d5de;
      font-size: .68rem;
      font-weight: 800;
    }
    .tag:first-child { border-color: #1768ff; color: #8db5ff; }

    .section-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 2px 11px;
      color: #c3c6d1;
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .08em;
      text-align: left;
    }
    .section-title::after { height: 2px; flex: 1; background: #1768ff; content: ""; }

    .link-list {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 10px;
    }
    .link-card {
      display: flex;
      min-height: 64px;
      align-items: center;
      gap: 12px;
      padding: 10px 13px;
      border: 1px solid #30323b;
      border-radius: 17px;
      background: #080a10;
      box-shadow: 0 4px 0 #030407;
      text-align: left;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    a.link-card:hover {
      box-shadow: 0 2px 0 #030407;
      transform: translateY(2px);
    }
    .link-icon {
      display: grid;
      width: 38px;
      flex: 0 0 38px;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 13px;
      background: #1768ff;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 900;
    }
    .link-text { min-width: 0; flex: 1; }
    .link-text strong { display: block; font-size: .82rem; font-weight: 900; }
    .link-text small { display: block; margin-top: 3px; color: #aeb3c2; font-size: .66rem; }
    .link-arrow { color: #6ea0ff; font-size: 1.1rem; }

    .fav-box {
      position: relative;
      z-index: 1;
      margin-top: 21px;
      padding: 15px;
      border: 1px solid #1768ff;
      border-radius: 18px;
      background: linear-gradient(125deg, #0757e8, #1768ff 55%, #0649cf);
      text-align: left;
    }
    .fav-title {
      margin: 0 0 7px;
      color: #fff;
      font-size: .68rem;
      font-weight: 900;
      letter-spacing: .08em;
    }
    .fav-copy { margin: 0; color: #eef4ff; font-size: .77rem; line-height: 1.8; }
    .fav-copy strong { color: #fff; }

    .footer {
      padding: 17px 0 0;
      color: #e5eeff;
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-align: center;
    }
    .footer span { color: #fff; }

    :focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    @media (min-width: 600px) {
      body { display: grid; min-height: 100vh; place-items: center; padding: 32px 18px; }
      .profile-card { padding: 31px 27px 27px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }

    body {
      padding: 34px 16px 42px;
      background:
        radial-gradient(ellipse at 12% 18%, rgba(32, 93, 229, .18), transparent 25rem),
        radial-gradient(ellipse at 89% 78%, rgba(45, 93, 208, .12), transparent 27rem),

    .profile-card::before, .profile-card::after { display: none; }
